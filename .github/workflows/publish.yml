name: Check Satary and refresh publisher briefing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  pages: write
concurrency:
  group: satary-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: npm ci
      - name: Test calculations and order execution
        run: npm test
      - name: Check workspace interactions
        run: npm run test:ui
      - name: Refresh publisher RSS snapshot
        if: github.event_name != 'pull_request'
        id: news
        continue-on-error: true
        run: python scripts/refresh-news.py
      - name: Report retained snapshot
        if: github.event_name != 'pull_request' && steps.news.outcome == 'failure'
        run: echo 'Feed refresh failed; retaining the existing snapshot and original timestamp.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save publisher snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/briefing.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publisher briefing snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request existing branch-based Pages build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
