name: Publish Satary and refresh briefing
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: satary-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: npm ci
      - name: Test calculations and order execution
        run: npm test
      - name: Check workspace interactions
        run: npm run test:ui
      - name: Refresh publisher RSS snapshot
        id: news
        continue-on-error: true
        run: python scripts/refresh-news.py
      - name: Report retained snapshot
        if: steps.news.outcome == 'failure'
        run: echo 'Feed refresh failed; publishing the last committed snapshot with its original timestamp.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R src data _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
